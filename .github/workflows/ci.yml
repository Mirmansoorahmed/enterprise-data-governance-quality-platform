name: ci

# oss profile only. Standard-library Python + pytest, no cloud account, no
# network-installed packages, so CI stays green offline (design s10). The
# declarative Great Expectations / dbt / official-ODCS-schema artefacts are the
# local/hybrid path; this Python engine is the documented unit equivalent.

on:
  push:
    branches: [main, spec]
  pull_request:
    branches: [main]

jobs:
  oss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runner
        run: python -m pip install pytest

      - name: Validate ODCS contracts and governance files
        run: python -m dgqp.cli validate
        env:
          PYTHONPATH: src

      - name: Run test suite (quality rules, schemas, lineage, workflow)
        run: python -m pytest
        env:
          PYTHONPATH: src

      - name: Print KPI scorecard (TARGET / last committed figures only)
        run: python -m dgqp.cli scorecard
        env:
          PYTHONPATH: src
